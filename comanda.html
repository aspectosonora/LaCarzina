<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comanda La Carzina</title>
  <link rel="icon" type="image/png" href="LA%20CARZINA%20ICONO.png">
  <link rel="apple-touch-icon" href="LA%20CARZINA%20ICONO.png">
  <style>
    :root{--ink:#151515;--muted:#666;--line:#cfcfcf;--paper:#fff;--bg:#f4efe3;--green:#064827;--tk-font:12px}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;padding:18px}
    .wrap{max-width:420px;margin:0 auto}
    .actions{display:flex;gap:8px;margin:0 0 12px}
    button{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}
    .primary{background:var(--green);color:#fff}
    .ghost{background:#fff;color:var(--green);border:1px solid #d8d1bf}
    .ticket{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.12);font-family:"Courier New",monospace;font-size:var(--tk-font)}
    .center{text-align:center}
    .brand{font-size:26px;font-weight:900;letter-spacing:1px}
    .sub{font-size:12px;line-height:1.45;color:#333;margin-top:4px}
    .line{border-top:1px dashed var(--line);margin:12px 0}
    .label{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:8px}
    .value{font-size:14px;white-space:pre-wrap;word-break:break-word}
    .product{padding:10px 0;border-bottom:1px dashed #ddd}
    .product h3{font-size:15px;margin:0 0 3px;text-transform:uppercase}
    .price{font-weight:900;text-align:right}
    .meta{font-size:12px;color:#333;white-space:pre-wrap;line-height:1.35}
    .money-row{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:13px}
    .money-row b{font-size:14px}
    .total{display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:900;margin-top:12px}
    .foot{text-align:center;font-size:12px;margin-top:14px;line-height:1.4}
    .state{background:#fff;border-radius:10px;padding:18px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,.08)}
    .state h1{font-size:22px;margin:0 0 8px;color:var(--green)}
    .state p{margin:0;color:var(--muted)}
    @media print{
      body{background:#fff;padding:0}
      .wrap{max-width:none;margin:0}
      .actions{display:none}
      .ticket{box-shadow:none;border:0;border-radius:0;width:58mm;margin:0;padding:4mm}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="actions">
      <button class="primary" type="button" onclick="window.print()">Imprimir</button>
      <button class="ghost" type="button" onclick="setTicketFont(-1)">A-</button>
      <button class="ghost" type="button" onclick="setTicketFont(1)">A+</button>
      <button class="ghost" type="button" onclick="location.reload()">Actualizar</button>
    </div>
    <div id="app" class="state"><h1>Cargando comanda...</h1><p>Espera un momento.</p></div>
  </main>

  <script src="firebase-config.js"></script>
  <script type="module">
  let fontSize=12;
  window.setTicketFont=function(delta){
    fontSize=Math.max(10,Math.min(16,fontSize+delta));
    document.documentElement.style.setProperty('--tk-font',fontSize+'px');
  };
  const appBox=document.getElementById('app');
  const config=window.LC_FIREBASE_CONFIG||{};
  const id=new URLSearchParams(location.search).get('id');
  const money=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:Number(n)%1?2:0,maximumFractionDigits:2});
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  function state(title,msg){
    appBox.className='state';
    appBox.innerHTML='<h1>'+esc(title)+'</h1><p>'+esc(msg||'')+'</p>';
  }
  function itemLines(it){
    const lines=[];
    if(it.codigoVenta)lines.push('Código: '+it.codigoVenta);
    if(it.presentacion)lines.push('Presentación: '+it.presentacion);
    if(it.guiso)lines.push('Guiso: '+it.guiso);
    if(it.guarniciones&&it.guarniciones.length)lines.push('Guarniciones: '+it.guarniciones.join(', '));
    if(it.extras&&it.extras.length)lines.push('Extras: '+it.extras.join(', '));
    if(it.notas)lines.push('Notas: '+it.notas);
    return lines.join('\n');
  }
  function render(data){
    const order=data.order||{};
    appBox.className='ticket';
    appBox.innerHTML=`
      <div class="center">
        <div class="brand">LA CARZINA</div>
        <div class="sub">Asadero y Cocina<br>París #2199 esq. Jesús García, Col. Bellavista<br>Tel: 644 142 7883</div>
      </div>
      <div class="line"></div>
      <div class="label">Pedido</div><div class="value">#${esc(order.folio||data.folio||'')}</div>
      <div class="label">Fecha</div><div class="value">${esc(order.fechaTexto||'')}</div>
      <div class="label">Cliente</div><div class="value">${esc(order.cliente||'')}</div>
      <div class="label">Tel</div><div class="value">${esc(order.tel||'')}</div>
      ${order.email?`<div class="label">Email</div><div class="value">${esc(order.email)}</div>`:''}
      <div class="label">Entrega</div><div class="value">${esc(order.entrega||'')}</div>
      <div class="label">Domicilio</div><div class="value">${esc(order.domicilio||'No aplica')}</div>
      <div class="label">Pago</div><div class="value">${esc(order.metodoPagoTexto||'Efectivo')}${order.pago&&order.pago.cambio?'\nPaga con: '+esc(order.pago.cambio):''}${order.pago&&order.pago.metodo==='transferencia'?'\n'+esc(order.pago.banco)+'\n'+esc(order.pago.cuenta)+'\n'+esc(order.pago.titular):''}</div>
      <div class="label">Notas</div><div class="value">${esc(order.notas||'-')}</div>
      <div class="line"></div>
      <div class="label">Productos</div>
      ${(order.items||[]).map(it=>`
        <div class="product">
          <h3>${esc((it.qty>1?it.qty+' x ':'')+it.nombre)}</h3>
          <div class="price">${money(Number(it.precio||0)*Number(it.qty||1))}</div>
          <div class="meta">${esc(itemLines(it))}</div>
        </div>`).join('')}
      <div class="money-row"><span>Subtotal</span><b>${money(order.subtotal||order.total||data.total||0)}</b></div>
      <div class="money-row"><span>Envio</span><b>${esc(order.envioTexto||'Por confirmar segun ubicacion')}</b></div>
      <div class="total"><span>${order.envioConfirmar?'TOTAL SIN ENVIO':'TOTAL'}</span><span>${money(order.total||data.total||0)}</span></div>
      <div class="foot">${order.envioConfirmar?'Envio por confirmar segun ubicacion.':''}<br><br>Gracias por tu pedido!<br>LA CARZINA - Asadero y Cocina</div>`;
  }

  if(!id){
    state('Comanda no encontrada','Falta el ID de la comanda.');
  }else if(!(config.apiKey&&config.projectId&&config.appId)){
    state('Firebase no configurado','Pega el firebaseConfig en comanda.html para poder leer comandas.');
  }else{
    try{
      const [{initializeApp},firestore]=await Promise.all([
        import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')
      ]);
      const {getFirestore,doc,getDoc}=firestore;
      const app=initializeApp(config);
      const db=getFirestore(app);
      const snap=await getDoc(doc(db,'comandas',id));
      if(!snap.exists())state('Comanda no encontrada','Verifica el enlace.');
      else{
        const data=snap.data();
        const expires=data.expiresAt&&data.expiresAt.toDate?data.expiresAt.toDate():null;
        if(expires&&expires<new Date())state('Comanda vencida','Esta comanda ya superó los 30 días.');
        else render(data);
      }
    }catch(err){
      console.error(err);
      state('No se pudo cargar','Revisa la conexión o la configuración de Firebase.');
    }
  }
  </script>
</body>
</html>
